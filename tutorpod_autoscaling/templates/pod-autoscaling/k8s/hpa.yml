{% set autoscaling_config = dict(iter_autoscaling_config().items(), **POD_AUTOSCALING_EXTRA_SERVICES) %}
{% for service, autoscaling in autoscaling_config.items() if autoscaling.get("enable_hpa") %}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{service}}
  labels:
    app.kubernetes.io/name: {{service}}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{service}}
  minReplicas: {{ autoscaling["min_replicas"] }}
  maxReplicas: {{ autoscaling["max_replicas"] }}
  metrics:
  {%- if autoscaling["avg_cpu"] > 0 %}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ autoscaling["avg_cpu"] }}
  {%- endif %}
  {%- if autoscaling["avg_memory"]|length %}
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: {{ autoscaling["avg_memory"] }}
  {%- endif %}
  {%- if autoscaling.get("behavior") %}
  {%- set beh = autoscaling["behavior"] %}
  behavior:
  {%- if beh.get("scaleDown") %}
  {%- set sd = beh["scaleDown"] %}
    scaleDown:
  {%- if sd.get("stabilizationWindowSeconds") is not none %}
      stabilizationWindowSeconds: {{ sd["stabilizationWindowSeconds"] }}
  {%- endif %}
  {%- if sd.get("selectPolicy") %}
      selectPolicy: {{ sd["selectPolicy"] }}
  {%- endif %}
  {%- if sd.get("policies") %}
      policies:
  {%- for p in sd["policies"] %}
      - type: {{ p["type"] }}
        value: {{ p["value"] }}
        periodSeconds: {{ p["periodSeconds"] }}
  {%- endfor %}
  {%- endif %}
  {%- endif %}
  {%- if beh.get("scaleUp") %}
  {%- set su = beh["scaleUp"] %}
    scaleUp:
  {%- if su.get("stabilizationWindowSeconds") is not none %}
      stabilizationWindowSeconds: {{ su["stabilizationWindowSeconds"] }}
  {%- endif %}
  {%- if su.get("selectPolicy") %}
      selectPolicy: {{ su["selectPolicy"] }}
  {%- endif %}
  {%- if su.get("policies") %}
      policies:
  {%- for p in su["policies"] %}
      - type: {{ p["type"] }}
        value: {{ p["value"] }}
        periodSeconds: {{ p["periodSeconds"] }}
  {%- endfor %}
  {%- endif %}
  {%- endif %}
  {%- endif %}
{% endfor %}
